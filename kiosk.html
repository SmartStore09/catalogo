<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Smart Store 09 — Vitrine</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Bebas+Neue&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════
   SMART STORE 09 · KIOSK V4 · DESIGN PREMIUM
   ═══════════════════════════════════════════════ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --gold:      #C9A84C;
  --gold-soft: rgba(201,168,76,.12);
  --gold-line: rgba(201,168,76,.14);
  --bg:        #040404;
  --s1:        #090909;
  --s2:        #0f0f0f;
  --border:    rgba(255,255,255,.055);
  --text:      #f2f2f2;
  --muted:     #6b6b6b;
  --dim:       #2e2e2e;
}

html, body { height: 100%; overflow: hidden; }
body {
  background: var(--bg);
  font-family: 'Inter', sans-serif;
  color: var(--text);
  display: flex;
  flex-direction: column;
}

/* ─────────────────────────────────────────
   HEADER
   ───────────────────────────────────────── */
.header {
  height: 66px;
  flex-shrink: 0;
  background: var(--s1);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 18px;
  padding: 0 22px;
}

/* Logo + Tagline */
.brand {
  display: flex;
  flex-direction: column;
  gap: 2px;
  flex-shrink: 0;
}
.brand-name {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 1.6rem;
  color: #ffffff;
  letter-spacing: 6px;
  line-height: 1;
  user-select: none;
}
.brand-tag {
  font-family: 'Montserrat', sans-serif;
  font-size: .42rem;
  color: var(--gold);
  letter-spacing: 3.5px;
  font-weight: 700;
  text-transform: uppercase;
}

/* Divisor */
.vr {
  width: 1px;
  height: 28px;
  background: linear-gradient(180deg, transparent, var(--border), transparent);
  flex-shrink: 0;
}

/* Barra de URL */
.urlbar {
  flex: 1;
  min-width: 0;
  height: 38px;
  display: flex;
  align-items: center;
  gap: 9px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 9px;
  padding: 0 12px;
  transition: border-color .2s, box-shadow .2s;
}
.urlbar:focus-within {
  border-color: rgba(201,168,76,.28);
  box-shadow: 0 0 0 3px rgba(201,168,76,.06);
}
.urlbar svg { flex-shrink: 0; }
.urlbar input {
  flex: 1;
  min-width: 0;
  background: none;
  border: none;
  outline: none;
  font-family: 'Inter', sans-serif;
  font-size: .71rem;
  color: var(--muted);
  transition: color .15s;
}
.urlbar input:focus { color: var(--text); }
.urlbar input::placeholder { color: var(--dim); }
.btn-ir {
  height: 26px;
  padding: 0 14px;
  background: var(--gold);
  border: none;
  border-radius: 6px;
  font-family: 'Montserrat', sans-serif;
  font-weight: 800;
  font-size: .6rem;
  letter-spacing: 1px;
  color: #000;
  cursor: pointer;
  flex-shrink: 0;
  transition: opacity .15s, transform .1s;
}
.btn-ir:hover  { opacity: .84; }
.btn-ir:active { transform: scale(.95); }

/* Badge de localização */
.loc {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-shrink: 0;
  padding: 5px 12px;
  background: rgba(255,255,255,.025);
  border: 1px solid var(--border);
  border-radius: 20px;
}
.loc-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--gold);
  animation: glow 2.8s ease-in-out infinite;
}
@keyframes glow {
  0%, 100% { box-shadow: 0 0 3px rgba(201,168,76,.4); }
  50%       { box-shadow: 0 0 8px rgba(201,168,76,.85); }
}
.loc-text {
  font-size: .54rem;
  font-weight: 500;
  color: var(--muted);
  letter-spacing: .8px;
}

/* ─────────────────────────────────────────
   BRANDS BAR
   ───────────────────────────────────────── */
.brands {
  height: 44px;
  flex-shrink: 0;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 2px;
  padding: 0 14px;
  overflow-x: auto;
  scrollbar-width: none;
}
.brands::-webkit-scrollbar { display: none; }

.br-btn {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 5px 14px;
  background: transparent;
  border: 1px solid transparent;
  border-radius: 7px;
  cursor: pointer;
  white-space: nowrap;
  font-family: 'Inter', sans-serif;
  font-size: .64rem;
  font-weight: 500;
  color: var(--muted);
  transition: background .18s, border-color .18s, color .18s;
  flex-shrink: 0;
}
.br-btn:hover {
  background: rgba(255,255,255,.04);
  border-color: var(--border);
  color: #b0b0b0;
}
.br-btn.active {
  background: var(--gold-soft);
  border-color: var(--gold-line);
  color: var(--gold);
  font-weight: 600;
}

/* Dot colorido por marca — único ícone identificador */
.br-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  flex-shrink: 0;
  transition: box-shadow .18s;
}
.br-btn.active .br-dot { box-shadow: 0 0 5px currentColor; }

.dot-botic  { background: #5aad72; }
.dot-mk     { background: #d63f8c; }
.dot-magalu { background: #3b82f6; }
.dot-natura { background: #e07b3a; }
.dot-ss09   { background: var(--gold); }

/* ─────────────────────────────────────────
   IFRAME
   ───────────────────────────────────────── */
.frame-wrap {
  flex: 1;
  position: relative;
  overflow: hidden;
  min-height: 0;
}
#kiosk-frame {
  width: 100%;
  height: 100%;
  border: none;
  display: block;
}

/* ─────────────────────────────────────────
   LOADING
   ───────────────────────────────────────── */
.loading {
  position: absolute;
  inset: 0;
  z-index: 20;
  background: var(--bg);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 0;
  transition: opacity .45s ease;
}
.loading.hide { opacity: 0; pointer-events: none; }

.ld-logo {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 3rem;
  color: #fff;
  letter-spacing: 7px;
  animation: rise .5s ease both;
}
.ld-tag {
  font-family: 'Montserrat', sans-serif;
  font-size: .45rem;
  color: var(--gold);
  letter-spacing: 4px;
  font-weight: 700;
  text-transform: uppercase;
  margin-top: 5px;
  margin-bottom: 26px;
  animation: rise .5s .08s ease both;
}
.ld-bar {
  width: 72px;
  height: 1px;
  background: rgba(255,255,255,.07);
  overflow: hidden;
  animation: rise .5s .15s ease both;
}
.ld-fill {
  height: 100%;
  background: linear-gradient(90deg, transparent, var(--gold), transparent);
  animation: sweep 1.5s ease-in-out infinite;
}
@keyframes sweep { 0% { transform: translateX(-100%); } 100% { transform: translateX(280%); } }
@keyframes rise  { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

/* ─────────────────────────────────────────
   TELA BLOQUEIO
   ───────────────────────────────────────── */
.blocked {
  position: absolute;
  inset: 0;
  z-index: 21;
  background: var(--bg);
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 12px;
  padding: 48px;
}
.blocked.show {
  display: flex;
  animation: fadein .3s ease;
}
@keyframes fadein { from { opacity: 0; transform: translateY(7px); } to { opacity: 1; transform: none; } }

.bl-ring {
  width: 54px;
  height: 54px;
  border-radius: 50%;
  background: var(--s2);
  border: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 4px;
}

/* Ícone inline SVG — lock */
.ic-lock { color: var(--muted); }

.bl-title {
  font-family: 'Montserrat', sans-serif;
  font-size: .88rem;
  font-weight: 700;
  color: var(--text);
  letter-spacing: .2px;
}
.bl-desc {
  font-size: .66rem;
  color: var(--muted);
  text-align: center;
  line-height: 1.8;
  max-width: 272px;
}
.bl-cta {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  background: var(--gold);
  color: #000;
  border: none;
  border-radius: 8px;
  padding: 11px 26px;
  font-family: 'Montserrat', sans-serif;
  font-weight: 800;
  font-size: .7rem;
  letter-spacing: .5px;
  text-decoration: none;
  cursor: pointer;
  margin-top: 8px;
  transition: opacity .15s, transform .1s;
}
.bl-cta:hover  { opacity: .83; }
.bl-cta:active { transform: scale(.97); }

/* ─────────────────────────────────────────
   WATERMARK
   ───────────────────────────────────────── */
.watermark {
  position: absolute;
  bottom: 14px;
  right: 14px;
  z-index: 10;
  pointer-events: none;
  display: flex;
  align-items: center;
  gap: 9px;
  background: rgba(4,4,4,.9);
  border: 1px solid var(--gold-line);
  border-radius: 10px;
  padding: 8px 14px;
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
}
.wm-name {
  font-family: 'Bebas Neue', sans-serif;
  font-size: .88rem;
  color: #fff;
  letter-spacing: 3px;
}
.wm-vr {
  width: 1px;
  height: 18px;
  background: rgba(255,255,255,.08);
}
.wm-info { display: flex; flex-direction: column; gap: 2px; }
.wm-city {
  font-size: .44rem;
  color: var(--muted);
  font-weight: 500;
  letter-spacing: 1.5px;
  text-transform: uppercase;
}
.wm-team {
  font-size: .5rem;
  color: var(--gold);
  font-weight: 600;
  letter-spacing: .5px;
}

/* ─────────────────────────────────────────
   TICKER
   ─────────────────────────────────────────
