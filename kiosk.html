<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Smart Store 09 — Vitrine Interna</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Bebas+Neue&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --gold:#C9A84C;
  --gold-dim:rgba(201,168,76,.14);
  --gold-line:rgba(201,168,76,.1);
  --bg:#060606;
  --surface:#0d0d0d;
  --text:#f0f0f0;
  --text-dim:#666;
}
body{background:var(--bg);font-family:'Inter',sans-serif;height:100vh;display:flex;flex-direction:column;overflow:hidden;}

/* ── HEADER ── */
.kiosk-header{
  background:var(--bg);
  border-bottom:1px solid #111;
  padding:0 20px;
  height:60px;
  display:flex;
  align-items:center;
  gap:16px;
  flex-shrink:0;
}
.brand-identity{display:flex;flex-direction:column;gap:2px;flex-shrink:0;}
.kiosk-logo{
  font-family:'Bebas Neue',sans-serif;
  font-size:1.45rem;
  color:#fff;
  letter-spacing:5px;
  line-height:1;
}
.kiosk-tagline{
  font-size:.48rem;
  color:var(--gold);
  letter-spacing:2.5px;
  font-weight:700;
  text-transform:uppercase;
  font-family:'Montserrat',sans-serif;
}
.h-divider{width:1px;height:26px;background:#1a1a1a;flex-shrink:0;}

/* ── URL BAR ── */
.url-bar{
  flex:1;
  display:flex;
  align-items:center;
  gap:8px;
  background:var(--surface);
  border:1px solid #181818;
  border-radius:8px;
  padding:7px 12px;
  min-width:0;
  transition:border-color .2s;
}
.url-bar:focus-within{border-color:rgba(201,168,76,.25);}
.url-icon{color:#333;font-size:.72rem;flex-shrink:0;}
.url-bar input{
  flex:1;background:none;border:none;
  color:#aaa;font-family:'Inter',sans-serif;font-size:.72rem;outline:none;min-width:0;
}
.url-bar input:focus{color:#e0e0e0;}
.url-bar input::placeholder{color:#2e2e2e;}
.url-go{
  background:var(--gold);border:none;border-radius:6px;
  padding:4px 14px;color:#000;font-weight:700;font-size:.67rem;
  cursor:pointer;flex-shrink:0;font-family:'Montserrat',sans-serif;
  letter-spacing:.5px;transition:opacity .15s;
}
.url-go:hover{opacity:.82;}

/* ── QUICK BRANDS ── */
.brands-bar{
  background:var(--surface);
  border-bottom:1px solid #0e0e0e;
  padding:0 14px;height:41px;
  display:flex;align-items:center;gap:2px;
  overflow-x:auto;scrollbar-width:none;flex-shrink:0;
}
.brands-bar::-webkit-scrollbar{display:none;}
.brand-quick{
  flex-shrink:0;display:flex;align-items:center;gap:5px;
  background:transparent;border:none;border-radius:6px;
  padding:5px 14px;cursor:pointer;font-size:.66rem;font-weight:500;
  color:var(--text-dim);transition:background .15s,color .15s;
  white-space:nowrap;font-family:'Inter',sans-serif;letter-spacing:.1px;
}
.brand-quick:hover{background:#151515;color:#bbb;}
.brand-quick.active{background:var(--gold-dim);color:var(--gold);font-weight:600;}

/* ── IFRAME ── */
.iframe-wrap{flex:1;position:relative;overflow:hidden;}
#site-frame{width:100%;height:100%;border:none;display:block;}

/* ── WATERMARK ── */
.overlay-badge{
  position:absolute;bottom:14px;right:14px;
  background:rgba(6,6,6,.92);
  border:1px solid var(--gold-line);
  border-radius:10px;padding:7px 14px;
  display:flex;align-items:center;gap:10px;
  backdrop-filter:blur(14px);
  pointer-events:none;z-index:10;
}
.overlay-logo{
  font-family:'Bebas Neue',sans-serif;font-size:.9rem;
  color:#fff;letter-spacing:3px;
}
.overlay-dot{width:2px;height:2px;border-radius:50%;background:var(--gold);opacity:.5;}
.overlay-txt{font-size:.5rem;color:#555;font-weight:500;line-height:1.5;}
.overlay-txt strong{color:var(--gold);}

/* ── LOADING ── */
.loading-screen{
  position:absolute;inset:0;background:var(--bg);
  display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:18px;z-index:5;transition:opacity .4s;
}
.loading-screen.hide{opacity:0;pointer-events:none;}
.loading-logo{font-family:'Bebas Neue',sans-serif;font-size:1.9rem;color:#fff;letter-spacing:6px;}
.loading-sub{font-size:.47rem;color:var(--gold);letter-spacing:3px;text-transform:uppercase;font-weight:700;margin-top:-14px;font-family:'Montserrat',sans-serif;}
.loading-bar{width:100px;height:1px;background:#181818;border-radius:1px;overflow:hidden;}
.loading-fill{height:100%;background:linear-gradient(90deg,transparent,var(--gold),transparent);animation:shine 1.4s ease-in-out infinite;}
@keyframes shine{0%{transform:translateX(-100%);}100%{transform:translateX(250%);}}

/* ── BLOCKED ── */
.blocked-screen{
  position:absolute;inset:0;background:var(--bg);
  display:none;flex-direction:column;align-items:center;
  justify-content:center;gap:12px;padding:40px;z-index:6;
}
.blocked-icon{
  width:50px;height:50px;border-radius:50%;
  background:#0e0e0e;border:1px solid #1e1e1e;
  display:flex;align-items:center;justify-content:center;font-size:1.3rem;
}
.blocked-title{
  font-size:.85rem;font-weight:600;color:var(--text);
  text-align:center;font-family:'Montserrat',sans-serif;
}
.blocked-sub{
  font-size:.68rem;color:var(--text-dim);text-align:center;
  line-height:1.7;max-width:300px;
}
.blocked-btn{
  background:var(--gold);color:#000;border:none;border-radius:8px;
  padding:11px 28px;font-family:'Montserrat',sans-serif;font-weight:700;
  font-size:.73rem;cursor:pointer;text-decoration:none;display:inline-block;
  letter-spacing:.5px;margin-top:6px;transition:opacity .15s;
}
.blocked-btn:hover{opacity:.82;}
</style>
</head>
<body>

<!-- ── HEADER ── -->
<div class="kiosk-header">
  <div class="brand-identity">
    <div class="kiosk-logo">SMART STORE 09</div>
    <div class="kiosk-tagline">Beleza · Tecnologia · Presentes</div>
  </div>
  <div class="h-divider"></div>
  <div class="url-bar">
    <span class="url-icon">🔗</span>
    <input type="text" id="url-input" placeholder="Cole o link do produto aqui...">
    <button class="url-go" onclick="loadUrl()">IR</button>
  </div>
</div>

<!-- ── QUICK BRANDS ── -->
<div class="brands-bar">
  <button class="brand-quick" onclick="loadBrand('boticario')">🌿 O Boticário</button>
  <button class="brand-quick" onclick="loadBrand('marykay')">💄 Mary Kay</button>
  <button class="brand-quick" onclick="loadBrand('magalu')">🛒 Magazine Você</button>
  <button class="brand-quick" onclick="loadBrand('natura')">🌸 Natura</button>
  <button class="brand-quick" onclick="loadBrand('catalogo')">📱 Catálogo Smart Store</button>
</div>

<!-- ── IFRAME AREA ── -->
<div class="iframe-wrap">

  <div class="loading-screen" id="loading">
    <div class="loading-logo">SMART STORE 09</div>
    <div class="loading-sub">Paraibano · MA</div>
    <div class="loading-bar"><div class="loading-fill"></div></div>
  </div>

  <div class="blocked-screen" id="blocked">
    <div class="blocked-icon">🔒</div>
    <div class="blocked-title">Este site não abre aqui</div>
    <div class="blocked-sub">O site bloqueou exibição em vitrine por segurança.<br>Abra em nova aba para mostrar ao cliente.</div>
    <a id="blocked-link" href="#" target="_blank" class="blocked-btn">Abrir em nova aba →</a>
  </div>

  <div class="overlay-badge">
    <div class="overlay-logo">SS09</div>
    <div class="overlay-dot"></div>
    <div class="overlay-txt">Apresentado por<br><strong>Jânio · Iza</strong></div>
  </div>

  <iframe id="site-frame" src=""
    sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox allow-top-navigation"
    onload="frameLoaded()"
    onerror="frameError()">
  </iframe>
</div>

<script>
const BRANDS = {
  boticario: 'https://minhaloja.boticario.com.br',
  marykay:   'https://mk.marykayintouch.com.br/s/',
  magalu:    'https://www.magazinevoce.com.br/magazinesmartstore09/',
  natura:    'https://www.natura.com.br',
  catalogo:  'https://smartstore09.github.io/catalogo/'
};

let currentUrl = '';
let loadTimer = null;
let loadStartTime = 0;

function loadBrand(brand) {
  document.querySelectorAll('.brand-quick').forEach(b => b.classList.remove('active'));
  const btns = document.querySelectorAll('.brand-quick');
  const idx = ['boticario','marykay','magalu','natura','catalogo'].indexOf(brand);
  if(idx >= 0) btns[idx].classList.add('active');
  const url = BRANDS[brand];
  document.getElementById('url-input').value = url;
  loadFrame(url);
}

function loadUrl() {
  let url = document.getElementById('url-input').value.trim();
  if (!url) return;
  if (!url.startsWith('http')) url = 'https://' + url;
  document.getElementById('url-input').value = url;
  document.querySelectorAll('.brand-quick').forEach(b => b.classList.remove('active'));
  loadFrame(url);
}

function loadFrame(url) {
  currentUrl = url;
  loadStartTime = Date.now();
  const frame = document.getElementById('site-frame');
  document.getElementById('blocked').style.display = 'none';
  document.getElementById('loading').classList.remove('hide');
  frame.src = url;
  clearTimeout(loadTimer);
  loadTimer = setTimeout(() => showBlocked(url), 4000);
}

function frameLoaded() {
  const elapsed = Date.now() - loadStartTime;
  const frame = document.getElementById('site-frame');
  try {
    const doc = frame.contentDocument || frame.contentWindow?.document;
    if (doc && doc.URL && doc.URL !== 'about:blank' && doc.URL !== '') {
      clearTimeout(loadTimer);
      document.getElementById('loading').classList.add('hide');
      document.getElementById('blocked').style.display = 'none';
      return;
    }
    clearTimeout(loadTimer);
    showBlocked(currentUrl);
  } catch(e) {
    if (elapsed < 900) return; // erro rápido = conexão recusada, aguarda timeout
    clearTimeout(loadTimer);
    document.getElementById('loading').classList.add('hide');
    document.getElementById('blocked').style.display = 'none';
  }
}

function frameError() {
  clearTimeout(loadTimer);
  showBlocked(currentUrl);
}

function showBlocked(url) {
  document.getElementById('loading').classList.add('hide');
  const blocked = document.getElementById('blocked');
  blocked.style.display = 'flex';
  document.getElementById('blocked-link').href = url;
}

document.getElementById('url-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') loadUrl();
});

window.onload = () => {
  loadBrand('catalogo');
  document.querySelectorAll('.brand-quick')[4].classList.add('active');
};
</script>
</body>
</html>
