*{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{background:var(--bg);color:var(--txt);font-family:-apple-system,'Segoe UI',sans-serif;max-width:480px;margin:0 auto;min-height:100vh;overflow-x:hidden;}

/* ─ TOP BAR ─ */
.topbar{position:sticky;top:0;z-index:200;background:#090909;border-bottom:1px solid #181818;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;}
.logo-txt{font-family:'Bebas Neue',sans-serif;font-size:1.5rem;letter-spacing:3px;color:var(--gold);line-height:1;}
.logo-sub{font-size:.58rem;color:#666;letter-spacing:1.5px;text-transform:uppercase;}
.topbar-wa{background:var(--wa);color:#fff;border:none;border-radius:22px;padding:9px 15px;font-size:.82rem;font-weight:700;text-decoration:none;display:flex;align-items:center;gap:5px;white-space:nowrap;flex-shrink:0;}

/* ─ SEARCH ─ */
.search-sec{padding:10px 13px 6px;background:#090909;border-bottom:1px solid #141414;}
.search-inp{width:100%;background:#161616;border:1.5px solid #232323;border-radius:11px;padding:12px 15px;color:#fff;font-size:1rem;outline:none;font-family:inherit;transition:border-color .2s;}
.search-inp:focus{border-color:var(--wa);}
.search-inp::placeholder{color:#555;}

/* ─ TABS ─ */
.tabs{display:flex;overflow-x:auto;scrollbar-width:none;background:#090909;border-bottom:2px solid #141414;}
.tabs::-webkit-scrollbar{display:none;}
.tab{flex-shrink:0;padding:12px 15px;font-size:.82rem;font-weight:700;color:#666;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap;transition:color .15s,border-color .15s;letter-spacing:.3px;}
.tab.on{color:var(--wa);border-bottom-color:var(--wa);}

/* ─ COUNT ─ */
.count-bar{padding:7px 14px;font-size:.7rem;color:#555;background:var(--bg);border-bottom:1px solid #111;}

/* ─ LIST ─ */
.list{padding:10px 12px 90px;display:flex;flex-direction:column;gap:10px;}

/* ─ CARD ─ */
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;cursor:pointer;transition:border-color .15s;}
.card:active{border-color:#333;}
.card-top{display:flex;gap:12px;margin-bottom:11px;}
.card-icon{width:74px;height:74px;border-radius:10px;background:#191919;display:flex;align-items:center;justify-content:center;font-size:2rem;flex-shrink:0;overflow:hidden;border:1px solid #242424;}
.card-icon img{width:100%;height:100%;object-fit:cover;border-radius:10px;}
.card-info{flex:1;min-width:0;}
.card-badge{display:inline-block;font-size:.55rem;font-weight:700;padding:2px 7px;border-radius:4px;margin-bottom:5px;text-transform:uppercase;letter-spacing:.5px;}
.by{background:rgba(201,168,76,.18);color:var(--gold);border:1px solid rgba(201,168,76,.3);}
.bg{background:rgba(37,211,102,.12);color:#4ade80;border:1px solid rgba(37,211,102,.3);}
.br{background:rgba(239,68,68,.12);color:#f87171;border:1px solid rgba(239,68,68,.3);}
.bb{background:rgba(59,130,246,.12);color:#60a5fa;border:1px solid rgba(59,130,246,.3);}
.bpink{background:rgba(236,72,153,.12);color:#f472b6;border:1px solid rgba(236,72,153,.3);}
.bgift{background:rgba(239,68,68,.12);color:#fca5a5;border:1px solid rgba(239,68,68,.3);}
.bpecas{background:rgba(14,165,233,.12);color:#38bdf8;border:1px solid rgba(14,165,233,.3);}
.benc{background:rgba(139,92,246,.18);color:#a78bfa;border:1px solid rgba(139,92,246,.4);}
.bedu{background:rgba(139,92,246,.12);color:#a78bfa;border:1px solid rgba(139,92,246,.3);}
.bgreen{background:rgba(34,197,94,.2);color:#4ade80;border:1px solid rgba(34,197,94,.4);}
.card-name{font-size:.98rem;font-weight:700;color:#fff;line-height:1.3;margin-bottom:3px;}
.card-specs{font-size:.73rem;color:var(--sub);line-height:1.4;}
.card-bottom{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}
.card-price{font-size:1.5rem;font-weight:800;color:var(--wa);}
.card-from{font-size:.68rem;color:var(--sub);margin-bottom:1px;}
.card-enc-tag{font-size:.72rem;color:var(--enc);margin-top:2px;}
.card-consult{font-size:1rem;font-weight:700;color:var(--gold);}
.btn-wa{display:inline-flex;align-items:center;gap:6px;background:var(--wa);color:#fff;border:none;border-radius:9px;padding:10px 16px;font-size:.88rem;font-weight:700;text-decoration:none;cursor:pointer;white-space:nowrap;transition:opacity .15s;}
.btn-wa:active{opacity:.85;}
.btn-wa-full{width:100%;justify-content:center;border-radius:10px;padding:13px;font-size:.95rem;margin-top:10px;}
.btn-consulta{background:transparent;border:1.5px solid var(--gold);color:var(--gold);}

.stok-ok{background:rgba(37,211,102,.12);color:#4ade80;border:1px solid rgba(37,211,102,.25);}

.hero-name{font-family:'Bebas Neue',sans-serif;font-size:2.2rem;letter-spacing:4px;color:var(--gold);line-height:1;margin-bottom:6px;}
.hero-desc{font-size:.8rem;color:#aaa;margin-bottom:18px;line-height:1.5;}
.hero-btn{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--wa);color:#fff;border:none;border-radius:13px;padding:15px;font-size:1rem;font-weight:700;text-decoration:none;box-shadow:0 4px 20px rgba(37,211,102,.3);}
.hero-chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:14px;}
.chip{background:#141414;border:1px solid #222;border-radius:20px;padding:5px 12px;font-size:.7rem;color:#aaa;}

.assist-sec{padding:16px 13px 0;}
.assist-title{font-size:1rem;font-weight:800;color:var(--gold);margin-bottom:12px;}
.assist-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:13px 14px;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;gap:10px;}
.assist-name{font-size:.9rem;font-weight:700;color:#fff;}
.assist-price{font-size:.82rem;color:var(--wa);font-weight:700;}
.assist-link{background:var(--wa);color:#fff;border:none;border-radius:8px;padding:8px 13px;font-size:.78rem;font-weight:700;text-decoration:none;flex-shrink:0;}

/* ─ EMPTY ─ */
.empty{text-align:center;padding:50px 20px;color:#444;}
.empty-ico{font-size:2.5rem;margin-bottom:12px;}
.empty-txt{font-size:.9rem;}

/* ─ FIXED WA ─ */
.fixed-wa{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;padding:16px 14px 14px;background:linear-gradient(transparent,#080808 40%);z-index:150;pointer-events:none;}

// ── UTILS ──
const WA_J = '5589988098980';
const WA_I = '5599984458625';
const REV_SLUG = new URLSearchParams(location.search).get('rev')||'';
const REV_NAME = REV_SLUG ? decodeURIComponent(REV_SLUG.replace(/-/g,' ')).replace(/\b\w/g,c=>c.toUpperCase()) : '';
const revRef = REV_NAME ? `\n\n🤝 Indicado por: ${REV_NAME}` : '';

function wa(num, msg){ return `https://wa.me/${num}?text=${encodeURIComponent(msg)}`; }
function fmtP(p){
  if(p===undefined||p===null||p==='') return null;
  const s = String(p).trim();
  if(!s) return null;
  return s.includes(',') ? s : s + ',00';
}
function waMsg(p){
  return `Olá! Vi ${p.name} (${p.code}) no catálogo e quero mais informações.${revRef}`;
}

// ── CARD ──
function mkCard(p){
  const fp = fmtP(p.price);
  const img = CODE_IMG[p.code] ? `<img src="${CODE_IMG[p.code]}" alt="${p.name}" loading="lazy">` : p.icon;
  const msgJ = waMsg(p);
  const waUrl = wa(WA_J, msgJ);
  const isEnc = p.stock==='enc';
  const isLast = p.stock==='last';
  const badge = p.badge ? `<span class="card-badge ${p.bc||'bb'}">${p.badge}</span><br>` : '';
  const stokTag = isEnc
    ? `<span class="stok stok-enc">📦 ~${p.deliveryDays||10} dias</span>`
    : isLast
    ? `<span class="stok stok-last">⚠ Último</span>`
    : `<span class="stok stok-ok">✓ Disponível</span>`;

  let priceHtml;
  if(fp){
    const pfx = p.from ? '<div class="card-from">A partir de</div>' : '';
    priceHtml = `${pfx}<div class="card-price">R$ ${fp}</div>`;
  } else {
    priceHtml = `<div class="card-consult">Consultar preço</div>`;
  }

  const btnLabel = isEnc ? '💬 Fazer Encomenda' : fp ? '💬 Comprar pelo WhatsApp' : '💬 Consultar';

  return `<div class="card">
  <div class="card-top">
    <div class="card-icon">${img}</div>
    <div class="card-info">
      ${badge}
      <div class="card-name">${p.name}</div>
      <div class="card-specs">${p.specs}</div>
      ${stokTag}
    </div>
  </div>
  <div class="card-bottom">
    ${priceHtml}
    <a class="btn-wa" href="${waUrl}">${btnLabel}</a>
  </div>
</div>`;
}

// ── TABS ──
let activeTab = 'todos';
let searchQ = '';

const CAT_MAP = {
  todos:    p => p.stock !== 'enc',
  celulares:p => ['iphones','android'].includes(p.cat),
  pecas:    p => ['pecas','componentes'].includes(p.cat),
  encomenda:p => p.stock === 'enc',
  mais:     p => ['acessorios','beleza','presentes','educacao','vitrine'].includes(p.cat),
  servicos: ()=> false,
};

function filtered(){
  const q = searchQ.toLowerCase().trim();
  let list = P.filter(CAT_MAP[activeTab] || (()=>true));
  if(q) list = P.filter(p =>
    p.name.toLowerCase().includes(q) ||
    (p.marca||'').toLowerCase().includes(q) ||
    (p.specs||'').toLowerCase().includes(q) ||
    (p.code||'').toLowerCase().includes(q)
  );
  return list;
}

function render(){
  const content = document.getElementById('content');
  const countBar = document.getElementById('count-bar');

  if(activeTab === 'servicos' && !searchQ){
    content.innerHTML = mkServicos();
    countBar.textContent = '';
    return;
  }

  const list = filtered();
  countBar.textContent = `${list.length} produto${list.length!==1?'s':''} encontrado${list.length!==1?'s':''}`;

  if(!list.length){
    content.innerHTML = `<div class="empty"><div class="empty-ico">🔍</div><div class="empty-txt">Nenhum produto encontrado.</div></div>`;
    return;
  }

  let html = '';
  if(activeTab === 'todos' && !searchQ){
    html += mkHero();
  }
  html += `<div class="list">${list.map(mkCard).join('')}</div>`;
  content.innerHTML = html;
}

function setTab(t){
  activeTab = t;
  searchQ = '';
  document.getElementById('search').value = '';
  document.querySelectorAll('.tab').forEach(el => el.classList.toggle('on', el.dataset.tab === t));
  render();
  window.scrollTo(0,0);
}

function doSearch(v){
  searchQ = v;
  // Mostrar count mesmo durante busca
  render();
}

// ── HERO ──
function mkHero(){
  return `<div class="hero">
  <div class="hero-name">Smart Store 09</div>
  <div class="hero-desc">Celulares · Peças · Assistência · Acessórios<br>Paraibano-MA · Atendimento pelo WhatsApp</div>
  <a class="hero-btn" href="https://wa.me/${WA_J}?text=${encodeURIComponent('Olá! Vi o catálogo da Smart Store 09 e quero atendimento.'+revRef)}">
    💬 Falar com a Smart Store 09
  </a>
  <div class="hero-chips">
    <span class="chip">📍 Paraibano-MA</span>
    <span class="chip">✅ Garantia</span>
    <span class="chip">💳 Parcelamento</span>
    <span class="chip">⚡ PIX</span>
  </div>
</div>`;
}

// ── ASSISTÊNCIA ──
function mkServicos(){
  const servicos = [
    ['🔲 Troca de Tela','A partir de R$ 180,00'],
    ['🔋 Troca de Bateria','Consultar'],
    ['🔌 Troca de Conector','R$ 100,00'],
    ['🔧 Placa de Carga','R$ 100,00'],
    ['💻 Formatação','Consultar'],
    ['🔍 Diagnóstico','GRÁTIS'],
    ['✨ Limpeza Técnica','Consultar'],
  ];
  const cards = servicos.map(([n,p])=>`
  <div class="assist-card">
    <div>
      <div class="assist-name">${n}</div>
      <div class="assist-price">${p}</div>
    </div>
    <a class="assist-link" href="${wa(WA_J,`Olá! Preciso de orçamento: ${n}${revRef}`)}">💬 Orçamento</a>
  </div>`).join('');
  return `<div class="assist-sec">
  <div class="assist-title">🔧 Assistência Técnica</div>
  ${cards}
  <div style="height:80px;"></div>
</div>`;
}

// ── WA LINKS ──
function updateWaLinks(){
  const msg = 'Olá! Vi o catálogo da Smart Store 09 e quero atendimento.' + revRef;
  const url = wa(WA_J, msg);
  document.getElementById('wa-top').href = url;
  document.getElementById('wa-footer').href = url;
}

// ── INIT ──
updateWaLinks();
render();
</script>
